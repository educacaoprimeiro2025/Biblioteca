<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Professor - Biblioteca Matosinho</title>
  <link rel="stylesheet" href="../css/variaveis.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/botoes.css">

</head>
<body>
<header class="cabecalho">
  <div class="logo">
    <img src="../assets/icones/icone_escola.png" width="100" height="80" alt="Logo da Biblioteca">
    <h1>Biblioteca Matosinho</h1>
  </div>
  <nav class="menu">
    <ul>
      <li><a href="home.html">Home</a></li>
      <li><a href="sobre.html">Sobre</a></li>
      <li><a href="projetos.html">Projetos</a></li>
      <li><a href="login.html" class="ativo">Login</a></li>
    </ul>
  </nav>
</header>



</header>

<main>
  <div class="login-container">
    <h1>Cadastro de Professor</h1>

    <form id="cadastroProfessor">
      <p>
        <label for="userProf">Nome de Usuário:</label>
        <input type="text" id="userProf" required>
      </p>
      <p>
        <label for="senhaProf">Senha:</label>
        <input type="password" id="senhaProf" required>
      </p>
      <button type="submit">Cadastrar</button>
      <p class="cadastro-link">
        Já tem conta? <a href="login.html">Voltar ao login</a>
      </p>
    </form>
  </div>
</main>


 <div class="acessibilidade-container">
    <button class="botao-acessibilidade" id="abrir-acessibilidade" aria-label="Acessibilidade">
      🖐️
    </button>

    <div class="menu-acessibilidade" id="menu-acessibilidade">
      <button id="aumentar-fonte" aria-label="Aumentar fonte">A+</button>
      <button id="diminuir-fonte" aria-label="Diminuir fonte">A-</button>
      <button id="toggle-dark" aria-label="Alternar modo escuro">🌙</button>
    </div>
  </div>


  <script src="../js/acess.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js"></script>
  <script type="module" src="../js/auth.js"></script>
 
</body>
</html>
